<form (ngSubmit)="login()" class="login" autocomplete="off">
  <h2>Login</h2>
  <mat-form-field appearance="fill" class="full-width">
    <mat-label>Username</mat-label>
    <input matInput [formControl]="username">
  </mat-form-field>
  <mat-form-field appearance="fill" class="full-width">
    <mat-label>Password</mat-label>
    <input matInput [formControl]="password" type="password">
  </mat-form-field>
  @if (error) {
    <div class="error">
      <mat-error>{{ error }}</mat-error>
    </div>
  }
  <button mat-raised-button color="primary" type="submit">Login</button>
  <button mat-raised-button color="primary" (click)="register()">Register</button>
</form>
