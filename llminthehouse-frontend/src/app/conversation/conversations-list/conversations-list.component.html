<div class="conversations-list">
  <h3>Your Conversations</h3>
  <table mat-table [dataSource]="conversations" class="mat-elevation-z8" style="width: 100%;">
    <ng-container matColumnDef="title">
      <th mat-header-cell *matHeaderCellDef>Title</th>
      <td mat-cell *matCellDef="let conv">{{ conv.title }}</td>
    </ng-container>
    <ng-container matColumnDef="createdAt">
      <th mat-header-cell *matHeaderCellDef>Created</th>
      <td mat-cell *matCellDef="let conv">{{ conv.createdAt | date:'short' }}</td>
    </ng-container>
    <ng-container matColumnDef="participants">
      <th mat-header-cell *matHeaderCellDef>Participants</th>
      <td mat-cell *matCellDef="let conv">{{ conv.participants?.length }}</td>
    </ng-container>
    <tr mat-header-row *matHeaderRowDef="['title', 'createdAt', 'participants']"></tr>
    <tr mat-row *matRowDef="let row; columns: ['title', 'createdAt', 'participants'];" (click)="onSelect(row)" style="cursor:pointer"></tr>
  </table>
  <mat-paginator [length]="conversations.length" [pageSize]="25" [pageSizeOptions]="[5, 10, 25, 100]"></mat-paginator>
</div>
